name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: january
          POSTGRES_USER: january
          POSTGRES_PASSWORD: january-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U january -d january"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.5"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - run: ./scripts/validate.sh
      - run: ./scripts/validate-zalo-feasibility.sh
      - run: ./scripts/validate-zalo-verification.sh
      - run: ./scripts/validate-observability.sh
      - run: ./scripts/validate-reliability.sh
      - run: ./scripts/validate-scalability.sh
      - run: ./scripts/validate-ambient.sh
      - run: ./scripts/validate-summaries.sh
      - run: uv run alembic upgrade head
        env:
          JANUARY_ENVIRONMENT: test
          JANUARY_DATABASE_HOST: 127.0.0.1
      - run: uv run pytest -m integration
        env:
          JANUARY_ENVIRONMENT: test
          JANUARY_DATABASE_HOST: 127.0.0.1
      - run: uv run alembic downgrade base && uv run alembic upgrade head
        env:
          JANUARY_ENVIRONMENT: test
          JANUARY_DATABASE_HOST: 127.0.0.1
      - run: uv run pytest -m ingress_integration
        env:
          JANUARY_ENVIRONMENT: test
          JANUARY_DATABASE_HOST: 127.0.0.1
          JANUARY_REDIS_URL: redis://127.0.0.1:6379/0
      - run: uv run pytest -m conversation_integration
        env:
          JANUARY_ENVIRONMENT: test
          JANUARY_DATABASE_HOST: 127.0.0.1
          JANUARY_REDIS_URL: redis://127.0.0.1:6379/0
      - run: uv run pytest -m planning_integration
        env:
          JANUARY_ENVIRONMENT: test
          JANUARY_DATABASE_HOST: 127.0.0.1
          JANUARY_REDIS_URL: redis://127.0.0.1:6379/0
      - run: uv run pytest -m delivery_integration
        env:
          JANUARY_ENVIRONMENT: test
          JANUARY_DATABASE_HOST: 127.0.0.1
          JANUARY_REDIS_URL: redis://127.0.0.1:6379/0
      - run: uv run pytest -m demo_integration
        env:
          JANUARY_ENVIRONMENT: test
          JANUARY_DATABASE_HOST: 127.0.0.1
          JANUARY_REDIS_URL: redis://127.0.0.1:6379/0
      - run: uv run alembic downgrade 0005_outbound_delivery && uv run alembic upgrade head && uv run pytest backend/tests/test_personality.py && uv run pytest -m 'planning_integration or personality_integration'
        env:
          JANUARY_ENVIRONMENT: test
          JANUARY_DATABASE_HOST: 127.0.0.1
          JANUARY_REDIS_URL: redis://127.0.0.1:6379/0
      - run: uv run pytest backend/tests/test_telegram_commands.py && uv run pytest -m command_integration
        env:
          JANUARY_ENVIRONMENT: test
          JANUARY_DATABASE_HOST: 127.0.0.1
          JANUARY_REDIS_URL: redis://127.0.0.1:6379/0
      - run: uv run pytest -m memory_integration && uv run alembic downgrade 0007_telegram_commands && uv run alembic upgrade head
        env:
          JANUARY_ENVIRONMENT: test
          JANUARY_DATABASE_HOST: 127.0.0.1
          JANUARY_REDIS_URL: redis://127.0.0.1:6379/0
      - run: ./scripts/validate-safety.sh
        env:
          JANUARY_DB_HOST_PORT: 5433
          JANUARY_REDIS_HOST_PORT: 6380
