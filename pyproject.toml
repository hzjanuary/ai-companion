[project]
name = "january"
version = "0.1.0"
description = "January social AI companion backend foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "pydantic-settings>=2.7,<2.8",
  "uvicorn[standard]>=0.34,<0.35",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.14,<1.15",
  "pytest>=8.3,<8.4",
  "ruff>=0.9,<0.10",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["backend/app"]
strict = true
warn_unreachable = true
